name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: daybook
          POSTGRES_PASSWORD: daybook
          POSTGRES_DB: daybook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daybook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: daybook
          POSTGRES_PASSWORD: daybook
          POSTGRES_DB: daybook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daybook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Start API
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://daybook:daybook@localhost:5432/daybook
          JWT_SECRET: ci-only-secret
        run: |
          uv sync
          uv run alembic upgrade head
          uv run uvicorn app.main:app --port 8000 &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'

      - name: Run Playwright E2E
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run dev &
          timeout 30 bash -c 'until curl -sf http://localhost:5173; do sleep 1; done'
          npx playwright test

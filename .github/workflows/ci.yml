name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: daybook
          POSTGRES_PASSWORD: daybook
          POSTGRES_DB: daybook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daybook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: daybook
          POSTGRES_PASSWORD: daybook
          POSTGRES_DB: daybook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daybook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Start API
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://daybook:daybook@localhost:5432/daybook
          JWT_SECRET: ci-only-secret
          # Defaults (5/min register, 10/min login) are tuned for a real user,
          # not a 25-test suite that registers a new account per test against
          # one long-lived server — trips the limiter and fails ~10 tests with
          # "Good day," never appearing, unrelated to whatever the PR changed.
          REGISTER_RATE_LIMIT: 1000/minute
          LOGIN_RATE_LIMIT: 1000/minute
          REFRESH_RATE_LIMIT: 1000/minute
        run: |
          uv sync
          uv run alembic upgrade head
          uv run uvicorn app.main:app --port 8000 &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'

      - name: Run Playwright E2E
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run dev &
          timeout 30 bash -c 'until curl -sf http://localhost:5173; do sleep 1; done'
          npx playwright test

  # EC2 is the real, permanent production backend (RDS is the permanent
  # database) — not the free-tier fallback render.yaml/DEPLOY.md describe.
  # This only runs after backend+frontend+e2e all pass, and only on main —
  # the one deploy target that previously had no such gate at all.
  deploy-ec2:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Diagnose deploy key (no secret bytes printed)
        run: |
          echo "line count: $(wc -l < ~/.ssh/deploy_key)"
          echo "byte count: $(wc -c < ~/.ssh/deploy_key)"
          echo "first line: $(sed -n '1p' ~/.ssh/deploy_key | cut -c1-30)..."
          echo "last line:  $(tail -n1 ~/.ssh/deploy_key | cut -c1-30)..."
          ssh-keygen -y -f ~/.ssh/deploy_key -P "" > /dev/null && echo "ssh-keygen: key parses OK" || echo "ssh-keygen: FAILED to parse key"

      - name: Sync backend code
        run: |
          rsync -avz --delete \
            --exclude '.venv' --exclude '__pycache__' --exclude '.pytest_cache' \
            --exclude '.ruff_cache' --exclude '*.pyc' --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/ "ec2-user@${{ secrets.EC2_HOST }}:~/backend/"

      - name: Build, migrate, and restart
        run: |
          ssh -i ~/.ssh/deploy_key "ec2-user@${{ secrets.EC2_HOST }}" '
            set -e
            cd ~/backend
            docker build -t daybook-api .
            docker run --rm --env-file .env daybook-api uv run alembic upgrade head
            docker stop daybook-api || true
            docker rm daybook-api || true
            docker run -d --name daybook-api --restart unless-stopped -p 80:8000 --env-file .env daybook-api
            sleep 5
            curl -sf http://localhost/health
          '

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Only meaningful under docker-compose, where "backend" resolves to the
    # backend service on the compose network — production serves this same
    # dist/ from Cloudflare Pages, which proxies /api via its own Function.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — client-side routing owns every non-file path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

services:
  # No restart policy on any service here, deliberately — these are dev
  # containers you start when you want them. "unless-stopped" would bring
  # them back silently after a Docker Desktop restart, squatting on ports
  # 8000/5173/5432 and shadowing whatever you're running natively there,
  # which is exactly the confusing state this comment is here to prevent.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: daybook
      POSTGRES_PASSWORD: daybook
      POSTGRES_DB: daybook
    ports:
      - "5432:5432"
    volumes:
      - daybook_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daybook"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local dev only — production runs the API on Render (see render.yaml) and
  # migrates via its own preDeployCommand, not this compose file.
  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://daybook:daybook@db:5432/daybook
      # Without this, `uv run` re-syncs on every container start and pulls in
      # the dev dependency group (ruff, mypy, ...) — dead weight at runtime.
      UV_NO_DEV: "1"
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Local dev only — production is a static build on Cloudflare Pages, whose
  # own Pages Function (frontend/functions/api/[[path]].js) proxies /api,
  # not nginx. nginx.conf's /api block below exists for this compose setup.
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  daybook_pg_data:

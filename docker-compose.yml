services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: daybook
      POSTGRES_PASSWORD: daybook
      POSTGRES_DB: daybook
    ports:
      - "5432:5432"
    volumes:
      - daybook_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daybook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  daybook_pg_data:
